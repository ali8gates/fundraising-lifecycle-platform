<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="862" viewBox="0 0 1500 862"><rect width="1500" height="862" fill="#EDF0F4"/><text x="46" y="56" font-family="Lato, DejaVu Sans, sans-serif" font-size="31" fill="#151B24" font-weight="700" text-anchor="start" letter-spacing="0">Where the sync actually breaks</text><text x="46" y="82" font-family="DejaVu Sans Mono, monospace" font-size="13.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">the two directions fail for different reasons, so they are built and watched separately</text><text x="1454" y="56" font-family="DejaVu Sans Mono, monospace" font-size="13" fill="#5A6675" font-weight="700" text-anchor="end" letter-spacing="0">fig 02</text><line x1="46" y1="100" x2="1454" y2="100" stroke="#C7D0DA" stroke-width="2"/><rect x="51" y="155" width="300" height="300" rx="3" fill="#D2D9E1"/><rect x="46" y="150" width="300" height="300" rx="3" fill="#FFFFFF" stroke="#C7D0DA" stroke-width="1.5"/><rect x="46" y="150" width="300" height="7" rx="0" fill="#B4442E"/><text x="64" y="194" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#151B24" font-weight="700" text-anchor="start" letter-spacing="0">Donor CRM</text><text x="64" y="214" font-family="Lato, DejaVu Sans, sans-serif" font-size="11" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">one per institution</text><rect x="64" y="231" width="8" height="8" fill="#B4442E"/><text x="80" y="242" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">environment A: current edition, full</text><text x="80" y="258" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">field set</text><rect x="64" y="277" width="8" height="8" fill="#B4442E"/><text x="80" y="288" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">environment B: older edition, no</text><text x="80" y="304" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">relationship field</text><rect x="64" y="323" width="8" height="8" fill="#B4442E"/><text x="80" y="334" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">environment C: hosted, custom fields</text><text x="80" y="350" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">renamed</text><text x="64" y="406" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#B4442E" font-weight="700" text-anchor="start" letter-spacing="0">same vendor, three behaviors</text><text x="64" y="426" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">a single patch cannot hold</text><rect x="1159" y="155" width="300" height="300" rx="3" fill="#D2D9E1"/><rect x="1154" y="150" width="300" height="300" rx="3" fill="#FFFFFF" stroke="#C7D0DA" stroke-width="1.5"/><rect x="1154" y="150" width="300" height="7" rx="0" fill="#0F7B6C"/><text x="1172" y="194" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#151B24" font-weight="700" text-anchor="start" letter-spacing="0">The platform</text><text x="1172" y="214" font-family="Lato, DejaVu Sans, sans-serif" font-size="11" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">pipeline, prospecting, reporting</text><rect x="1172" y="231" width="8" height="8" fill="#0F7B6C"/><text x="1188" y="242" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">canonical constituent store</text><rect x="1172" y="261" width="8" height="8" fill="#0F7B6C"/><text x="1188" y="272" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">pipeline stage and owner</text><rect x="1172" y="291" width="8" height="8" fill="#0F7B6C"/><text x="1188" y="302" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">gift attribution by initiative</text><text x="1172" y="406" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#0F7B6C" font-weight="700" text-anchor="start" letter-spacing="0">products only work on complete data</text><text x="1172" y="426" font-family="DejaVu Sans Mono, monospace" font-size="11.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">partial data reads as a broken product</text><rect x="391" y="155" width="728" height="300" rx="3" fill="#D2D9E1"/><rect x="386" y="150" width="728" height="300" rx="3" fill="#FFFFFF" stroke="#C7D0DA" stroke-width="1.5"/><rect x="386" y="150" width="728" height="7" rx="0" fill="#1F3A5F"/><text x="406" y="194" font-family="Lato, DejaVu Sans, sans-serif" font-size="20" fill="#151B24" font-weight="700" text-anchor="start" letter-spacing="0">Mapping and guard layer</text><text x="406" y="214" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">the only place vendor field names are allowed to appear</text><circle cx="416" cy="242" r="10" fill="#1F3A5F"/><text x="416" y="245.5" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">1</text><text x="436" y="246" font-family="Lato, DejaVu Sans, sans-serif" font-size="12" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">profile selected by system and environment, not by code branch</text><circle cx="416" cy="276" r="10" fill="#1F3A5F"/><text x="416" y="279.5" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">2</text><text x="436" y="280" font-family="Lato, DejaVu Sans, sans-serif" font-size="12" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">raw record mapped into the canonical shape, errors returned not thrown</text><circle cx="416" cy="310" r="10" fill="#1F3A5F"/><text x="416" y="313.5" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">3</text><text x="436" y="314" font-family="Lato, DejaVu Sans, sans-serif" font-size="12" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">household role resolved with ordered signals and a confidence value</text><circle cx="416" cy="344" r="10" fill="#1F3A5F"/><text x="416" y="347.5" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">4</text><text x="436" y="348" font-family="Lato, DejaVu Sans, sans-serif" font-size="12" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">below the floor, the record is held for review and never written through</text><circle cx="416" cy="378" r="10" fill="#1F3A5F"/><text x="416" y="381.5" font-family="DejaVu Sans Mono, monospace" font-size="11" fill="#FFFFFF" font-weight="700" text-anchor="middle" letter-spacing="0">5</text><text x="436" y="382" font-family="Lato, DejaVu Sans, sans-serif" font-size="12" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">counts recorded on both sides so a quiet run shows up as a mismatch</text><line x1="352" y1="506" x2="1139.0" y2="506.0" stroke="#0F7B6C" stroke-width="3"/><polygon points="1148,506 1139.0,510.5 1139.0,501.5" fill="#0F7B6C"/><text x="750.0" y="492" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#0F7B6C" font-weight="700" text-anchor="middle" letter-spacing="0">outbound, platform to CRM</text><text x="750.0" y="530" font-family="Lato, DejaVu Sans, sans-serif" font-size="12" fill="#5A6675" font-weight="400" text-anchor="middle" letter-spacing="0">this direction held. I control the payload and the retry.</text><line x1="1148" y1="580" x2="361.0" y2="580.0" stroke="#B4442E" stroke-width="3"/><polygon points="352,580 361.0,575.5 361.0,584.5" fill="#B4442E"/><text x="750.0" y="566" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#B4442E" font-weight="700" text-anchor="middle" letter-spacing="0">inbound, CRM to platform</text><text x="750.0" y="604" font-family="Lato, DejaVu Sans, sans-serif" font-size="12" fill="#5A6675" font-weight="400" text-anchor="middle" letter-spacing="0">this direction is where every incident came from.</text><rect x="51" y="643" width="1408" height="150" rx="3" fill="#D2D9E1"/><rect x="46" y="638" width="1408" height="150" rx="3" fill="#FBFCFD" stroke="#C7D0DA" stroke-width="1.5"/><rect x="46" y="638" width="1408" height="7" fill="#B4442E"/><text x="68" y="676" font-family="Lato, DejaVu Sans, sans-serif" font-size="17" fill="#151B24" font-weight="700" text-anchor="start" letter-spacing="0">four failures that look like one bug</text><text x="68" y="706" font-family="Lato, DejaVu Sans, sans-serif" font-size="13" fill="#B4442E" font-weight="700" text-anchor="start" letter-spacing="0">ambiguous identity</text><text x="68" y="726" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">a required child field plus one email, so the</text><text x="68" y="741" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">record cannot say whether it is the parent or the</text><text x="68" y="756" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">student</text><text x="409" y="706" font-family="Lato, DejaVu Sans, sans-serif" font-size="13" fill="#B4442E" font-weight="700" text-anchor="start" letter-spacing="0">environment variance</text><text x="409" y="726" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">the same call returns a different shape per</text><text x="409" y="741" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">institution, so the fix is a profile</text><line x1="396" y1="690" x2="396" y2="774" stroke="#C7D0DA" stroke-width="1.5"/><text x="750" y="706" font-family="Lato, DejaVu Sans, sans-serif" font-size="13" fill="#B4442E" font-weight="700" text-anchor="start" letter-spacing="0">silent success</text><text x="750" y="726" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">a run reports fine and moves nothing, and nobody</text><text x="750" y="741" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">notices for weeks</text><line x1="737" y1="690" x2="737" y2="774" stroke="#C7D0DA" stroke-width="1.5"/><text x="1091" y="706" font-family="Lato, DejaVu Sans, sans-serif" font-size="13" fill="#B4442E" font-weight="700" text-anchor="start" letter-spacing="0">regression</text><text x="1091" y="726" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">the fix holds until the vendor ships, because there</text><text x="1091" y="741" font-family="Lato, DejaVu Sans, sans-serif" font-size="11.5" fill="#151B24" font-weight="400" text-anchor="start" letter-spacing="0">was no contract test</text><line x1="1078" y1="690" x2="1078" y2="774" stroke="#C7D0DA" stroke-width="1.5"/><text x="46" y="838" font-family="DejaVu Sans Mono, monospace" font-size="12.5" fill="#5A6675" font-weight="400" text-anchor="start" letter-spacing="0">Nothing here removes the vendor constraint. It moves the constraint into one layer I can test, configure per institution, and watch.</text></svg>